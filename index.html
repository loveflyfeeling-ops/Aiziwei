<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="紫微斗數雙系統論命：欽天四化與占驗派排盤、四化飛星與命書輸出">
<title>紫微斗數雙系統論命</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Serif+TC:wght@500;700&display=swap">
<style>
/* 版面：左側問測者面板 + 右側傳統十二宮方盤（中宮為命主資料），下方為命書輸出 */
:root{
  --bg:#EEF0F4; --paper:#FBFBFD; --ink:#1C1F2B; --muted:#5E6475; --line:#C9CDD8; --soft:#E2E5EC;
  --accent:#8A6A1F; --accent-ink:#FFFFFF; --sel:#F3E7C6; --sf:#F7F1E1;
  --lu:#1D7A4C; --quan:#7A3E9D; --ke:#2563A6; --ji:#C0362C; --sha:#9B3B30; --luck:#1D6A7A;
  --display:"LXGW WenKai TC","Noto Serif TC","PingFang TC","Microsoft JhengHei",serif;
  --serif:"Noto Serif TC","PMingLiU",serif;
  --sans:system-ui,-apple-system,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12141B; --paper:#1A1D27; --ink:#E6E8EF; --muted:#9AA0B2; --line:#343949; --soft:#262A37;
  --accent:#D9B45A; --accent-ink:#1A1608; --sel:#3A3220; --sf:#2A261C;
  --lu:#4CC78A; --quan:#C08BE0; --ke:#6FA8E8; --ji:#F0776B; --sha:#E28A7E; --luck:#5EC2D4; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12141B; --paper:#1A1D27; --ink:#E6E8EF; --muted:#9AA0B2; --line:#343949; --soft:#262A37;
  --accent:#D9B45A; --accent-ink:#1A1608; --sel:#3A3220; --sf:#2A261C;
  --lu:#4CC78A; --quan:#C08BE0; --ke:#6FA8E8; --ji:#F0776B; --sha:#E28A7E; --luck:#5EC2D4; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6}
.wrap{max-width:1280px;margin:0 auto;padding:20px 16px 48px;display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
.top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 20px;border-bottom:1px solid var(--line);padding-bottom:12px}
.top h1{font-family:var(--display);font-weight:700;font-size:clamp(1.6rem,3vw,2.2rem);margin:0;letter-spacing:.04em;text-wrap:balance}
.top p{margin:0;color:var(--muted);font-size:.9rem}
.school{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:8px}
.school label{padding:4px 12px;border-radius:6px;cursor:pointer;font-size:.9rem}
.school input{position:absolute;opacity:0;pointer-events:none}
.school label:has(input:checked){background:var(--paper);color:var(--accent);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.school label:has(input:focus-visible){outline:2px solid var(--accent)}
.main{display:grid;grid-template-columns:280px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.main{grid-template-columns:minmax(0,1fr)}}
.panel{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;min-width:0}
.box{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px}
.box h2{font-family:var(--display);font-size:1.05rem;margin:0 0 10px;letter-spacing:.06em}
form{display:grid;gap:10px}
.f{display:grid;gap:3px;font-size:.85rem;color:var(--muted)}
.f input,.f select{font:inherit;font-size:.95rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chk{display:flex;align-items:center;gap:6px;font-size:.85rem}
.btns{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:7px 14px;font-weight:600}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:focus-visible,.cell:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#caseList{list-style:none;margin:0;padding:0;display:grid;gap:2px;max-height:240px;overflow:auto}
#caseList li{display:flex}
#caseList button{flex:1;text-align:left;background:none;border:0;border-radius:6px;padding:5px 8px;color:var(--ink)}
#caseList button[aria-current="true"]{background:var(--sel);font-weight:700}
#caseList button:hover{background:var(--soft)}
#caseList small{color:var(--muted);margin-left:6px;font-size:.75rem}
#caseList .del{flex:0 0 auto;color:var(--muted);font-size:.8rem}
.ref{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ref input{font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
.ref button{background:var(--soft);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:4px 8px;font-size:.85rem}
.err{color:var(--ji);font-size:.9rem;margin:0}
/* 命盤 */
.chartbox{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;min-width:0}
#scopeTabs{display:flex;flex-wrap:wrap;gap:6px}
#scopeTabs button{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:4px 14px;font-size:.9rem}
#scopeTabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chartscroll{overflow-x:auto;border-radius:10px}
#chart{position:relative;display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));grid-template-rows:repeat(4,minmax(168px,auto));min-width:620px;background:var(--line);gap:1px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.cell{all:unset;box-sizing:border-box;background:var(--paper);padding:7px 7px 5px;display:flex;flex-direction:column;gap:3px;cursor:pointer;position:relative;min-width:0}
.cell:hover{background:var(--sf)}
.cell.sf{background:var(--sf)}
.cell.sel{background:var(--sel)}
.cell.life::after{content:"";position:absolute;inset:2px;border:2px solid var(--accent);border-radius:4px;pointer-events:none}
.stars{display:flex;flex-wrap:wrap;gap:2px 8px}
.st{white-space:nowrap;display:inline-flex;flex-wrap:wrap;align-items:baseline;max-width:100%;row-gap:1px}
.st.maj{font-family:var(--serif);font-weight:700;font-size:1.02rem;color:var(--ink)}
.st.min{font-size:.82rem;color:var(--muted)}
.st.min.sha{color:var(--sha)} .st.min.luck{color:var(--luck)}
.st sub{font-size:.66rem;font-weight:400;color:var(--muted);vertical-align:baseline;margin-left:1px}
.empty{color:var(--muted);font-size:.85rem}
.minors{display:flex;flex-wrap:wrap;gap:0 8px}
.adj{font-size:.7rem;color:var(--muted);line-height:1.35}
.scs{font-size:.72rem;color:var(--accent);line-height:1.35}
.hua{font-style:normal;display:inline-block;font-size:.66rem;line-height:1;padding:2px 3px;border-radius:3px;margin-left:2px;color:#fff;vertical-align:2px;font-family:var(--sans);font-weight:700}
.h-祿{background:var(--lu)} .h-權{background:var(--quan)} .h-科{background:var(--ke)} .h-忌{background:var(--ji)}
.hua.self,.hua.sc{background:transparent;border:1px solid currentColor}
.hua.self::before{content:"↑"}
.hua.in{background:transparent;border:1px solid currentColor;border-style:dotted}
.hua.in::before{content:"↓"}
.hua.in.h-祿{color:var(--lu)} .hua.in.h-權{color:var(--quan)} .hua.in.h-科{color:var(--ke)} .hua.in.h-忌{color:var(--ji)}
.hua.self.h-祿,.hua.sc.h-祿{color:var(--lu)} .hua.self.h-權,.hua.sc.h-權{color:var(--quan)} .hua.self.h-科,.hua.sc.h-科{color:var(--ke)} .hua.self.h-忌,.hua.sc.h-忌{color:var(--ji)}
.hua.sc{border-style:dashed}
.hua.ly{background:transparent;border:1px solid currentColor;font-weight:700}
.hua.ly.h-祿{color:var(--lu)} .hua.ly.h-權{color:var(--quan)} .hua.ly.h-科{color:var(--ke)} .hua.ly.h-忌{color:var(--ji)}
.hua.ly.yr{border-style:dashed} .hua.ly.xl{border-style:double;border-width:3px}
.yg{display:flex;flex-wrap:wrap;gap:0 6px;font-size:.72rem;line-height:1.35;color:var(--ke)}
.yg b{background:var(--ke);color:var(--paper);border-radius:3px;padding:0 4px;font-weight:700}
.yg .xs{color:var(--quan)} .hua.ly.mo,.hua.ly.dy{border-style:dotted}
.kadj{font-size:.74rem;line-height:1.35;display:flex;flex-wrap:wrap;gap:0 6px}
.ka{color:var(--quan)} .ka.kb{color:var(--sha)}

.foot{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;gap:4px;font-size:.72rem;color:var(--muted);line-height:1.25;padding-top:4px;border-top:1px dotted var(--line)}
.pn{text-align:center;display:grid}
.pn b{font-family:var(--display);font-size:.98rem;color:var(--ink);letter-spacing:.08em}
.pn b em{font-style:normal;font-size:.68rem;background:var(--accent);color:var(--accent-ink);border-radius:3px;padding:0 3px;margin-left:3px;vertical-align:2px}
.pn .scn{font-size:.78rem;color:var(--accent);letter-spacing:0}
.gz{text-align:right;font-family:var(--serif);font-size:.8rem;color:var(--ink)}
.center{grid-row:2/4;grid-column:2/4;background:var(--paper);padding:14px 18px;display:flex;flex-direction:column;gap:6px;position:relative;isolation:isolate}
.center>*:not(svg){position:relative;z-index:1}
.cname{font-family:var(--display);font-size:1.5rem;font-weight:700;letter-spacing:.05em}
.cmeta{color:var(--muted);font-size:.85rem}
.center dl{display:grid;grid-template-columns:auto 1fr;gap:1px 12px;margin:4px 0;font-size:.86rem}
.center dt{color:var(--muted)} .center dd{margin:0;font-variant-numeric:tabular-nums}
.flybox{display:flex;background:color-mix(in srgb,var(--bg) 85%,transparent);flex-wrap:wrap;gap:4px 10px;font-size:.85rem;background:var(--bg);border-radius:6px;padding:8px 10px}
.flybox b{width:100%;font-family:var(--display)} .flybox small{width:100%;color:var(--muted)}
.flybox.hint{color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px;font-size:.75rem;color:var(--muted);margin-top:auto}
svg.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;opacity:.55}
svg.lines line{vector-effect:non-scaling-stroke;stroke-width:1.6}
.sfl{stroke:var(--accent);stroke-dasharray:4 3;opacity:.8}
.fl.f-祿{stroke:var(--lu)} .fl.f-權{stroke:var(--quan)} .fl.f-科{stroke:var(--ke)} .fl.f-忌{stroke:var(--ji);stroke-width:2.4}
/* 命書選單 */
.book{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
#menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
#menu fieldset{border:1px solid var(--line);border-radius:8px;margin:0;padding:8px 12px 10px;display:grid;gap:2px;min-width:0}
#menu legend{font-family:var(--display);font-weight:700;padding:0 4px;display:flex;gap:8px;align-items:center}
#menu legend span{display:flex;gap:4px}
#menu legend button{font-family:var(--sans);font-weight:400;font-size:.72rem;border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:4px;padding:0 6px}
#menu label{display:flex;align-items:flex-start;gap:6px;font-size:.88rem;cursor:pointer;line-height:1.45;padding:2px 0}
#menu input{margin-top:3px;accent-color:var(--accent)}
.tag{font-style:normal;font-size:.68rem;border-radius:3px;padding:1px 5px;margin-left:4px;white-space:nowrap;border:1px solid}
.tag.qt{color:var(--ke)} .tag.zy{color:var(--quan)}
/* 命書內容 */
#report{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;min-width:0}
.rh{border-bottom:2px solid var(--ink);padding-bottom:8px}
.rh h2{font-family:var(--display);font-size:1.6rem;margin:0}
.rh p{margin:4px 0 0;color:var(--muted);font-size:.88rem}
.gh{font-family:var(--display);font-size:1.25rem;margin:10px 0 0;color:var(--accent);letter-spacing:.08em}
.rs{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px 18px}
.rs h3{font-family:var(--display);font-size:1.1rem;margin:0 0 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rs h3 .tag{margin:0;font-family:var(--sans)}
.rs h4{font-family:var(--display);font-size:.98rem;margin:12px 0 4px}
.rs h4 small{font-family:var(--sans);font-weight:400;color:var(--muted);margin-left:8px;font-size:.8rem}
.rs p,.rs li{max-width:72ch}
.rs ul{margin:0;padding-left:1.2em;display:grid;gap:4px}
.pal{border-top:1px dotted var(--line);padding-top:4px}
.pal:first-of-type{border-top:0}
.pal p{margin:2px 0 6px}
.muted{color:var(--muted)}
.zy-note{background:var(--sf);border-radius:6px;padding:8px 12px}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.pat{border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:grid;gap:2px}
.pat b{font-family:var(--display);color:var(--accent)}
.pat span{font-size:.88rem}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--soft);white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:.8rem}
tr.now td{background:var(--sel);font-weight:600}
td.bar{width:30%;min-width:100px}
td.bar span{display:block;height:8px;border-radius:4px}
td.bar .pos{background:var(--lu)} td.bar .neg{background:var(--ji)}
.lv{font-style:normal;font-size:.78rem;padding:1px 8px;border-radius:999px;border:1px solid}
.lv.g2,.lv.g1{color:var(--lu)} .lv.n{color:var(--muted)} .lv.b1,.lv.b2{color:var(--ji)}
.lv.g2,.lv.b2{font-weight:700}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.kv div{background:var(--bg);border-radius:8px;padding:10px 12px;display:grid}
.kv span{font-size:.78rem;color:var(--muted)} .kv b{font-family:var(--display);font-size:1.1rem}
.foot-note{font-size:.82rem}
/* 手機：整盤縮放至螢幕寬度，一眼看全盤 */
@media (max-width:680px){
  .chartscroll{overflow:visible}
  #chart{min-width:0;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(4,minmax(96px,auto));border-radius:8px}
  .cell{padding:3px 3px 2px;gap:1px}
  .stars{gap:0 3px}
  .st.maj{font-size:.8rem;line-height:1.25}
  .st.min{font-size:.64rem;line-height:1.3}
  .minors{gap:0 3px}
  .st sub{font-size:.52rem}
  .hua{font-size:.5rem;padding:1px 1px;margin-left:1px;vertical-align:1px}
  .adj{display:none}
  .kadj{font-size:.58rem;gap:0 3px;line-height:1.25}
  .yg{font-size:.56rem;gap:0 3px;line-height:1.25}
  .scs{font-size:.56rem;line-height:1.25}
  .foot{font-size:.55rem;padding-top:2px}
  .foot .cs{display:none}
  .pn b{font-size:.74rem;letter-spacing:0}
  .pn b em{font-size:.5rem;padding:0 2px}
  .pn small{font-size:.5rem}
  .pn .scn{font-size:.6rem}
  .gz{font-size:.6rem}
  .empty{font-size:.66rem}
  .center{padding:6px 7px;gap:3px}
  .cname{font-size:1rem}
  .cmeta{font-size:.62rem}
  .center dl{font-size:.6rem;gap:0 5px;margin:0;line-height:1.35}
  .flybox{font-size:.6rem;padding:4px 5px;gap:1px 5px}
  .flybox.hint{display:none}
  .legend{font-size:.52rem;gap:2px 4px}
}
@media (max-width:380px){ .st.maj{font-size:.72rem} .center dl dt:nth-of-type(n+6),.center dl dd:nth-of-type(n+6){display:none} }
.meter{display:inline-block;width:90px;height:8px;border-radius:4px;background:var(--soft);vertical-align:middle;margin-right:6px;overflow:hidden}
.meter span{display:block;height:100%}
.meter .pos{background:var(--lu)} .meter .mid{background:var(--accent)} .meter .neg{background:var(--ji)}
table.mt td{white-space:normal;vertical-align:top;min-width:90px} table.mt small{color:var(--muted)}
small.ok{color:var(--lu)!important} small.ng{color:var(--ji)!important}
svg.curve{width:100%;min-width:480px;height:auto;display:block}
svg.curve .cg{stroke:var(--soft);stroke-width:1} svg.curve .ct{fill:var(--muted);font-size:11px}
svg.curve .cl{fill:none;stroke:var(--accent);stroke-width:2.2} svg.curve .cd{fill:var(--paper);stroke:var(--accent);stroke-width:2} svg.curve .cn{fill:var(--ji)}
.dec-note{background:var(--sf);border-radius:6px;padding:6px 10px;margin:4px 0}
ul.yl{list-style:none;padding:0;display:grid;gap:6px}
ul.yl li{border-left:3px solid var(--line);padding:2px 0 2px 10px}
ul.yl li.now{border-color:var(--ji)} ul.yl li.fut{border-color:var(--accent)}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important}}
</style>
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style></head><body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>紫微斗數雙系統論命</h1>
      <p>欽天四化 × 占驗派・排盤、四化飛星與命書輸出</p>
    </div>
    <div class="school" role="radiogroup" aria-label="派別設定">
      <label><input type="radio" name="school" id="sc-zy" value="zy">占驗派</label>
      <label><input type="radio" name="school" id="sc-qt" value="qt">欽天四化</label>
    </div>
  </header>

  <div class="main">
    <aside class="panel">
      <section class="box">
        <h2>問測者基本資料</h2>
        <form id="form">
          <label class="f">姓名<input id="fName" autocomplete="off"></label>
          <div class="row2">
            <label class="f">性別<select id="fGender"><option value="男">男</option><option value="女">女</option></select></label>
            <label class="f">曆法<select id="fCal"><option value="solar">國曆</option><option value="lunar">農曆</option></select></label>
          </div>
          <label class="f">出生日期<input id="fDate" type="date" min="1900-01-01" max="2100-12-31"></label>
          <label class="chk" id="leapWrap" hidden><input type="checkbox" id="fLeap">閏月</label>
          <label class="f">出生時辰<select id="fHour"></select></label>
          <div class="btns">
            <button class="btn" type="submit">排盤</button>
            <button class="btn ghost" type="button" id="saveCase">儲存問測者</button>
          </div>
          <p class="err" id="err" role="alert" hidden></p>
        </form>
      </section>
      <section class="box">
        <h2>問測者名單</h2>
        <ul id="caseList"></ul>
      </section>
    </aside>

    <section class="chartbox" aria-label="紫微斗數星盤">
      <div class="ref">
        <label for="fRef" class="muted">論命日期</label><input type="date" id="fRef">
        <button type="button" id="yPrev" aria-label="前一年">‹ 年</button><button type="button" id="yNext" aria-label="後一年">年 ›</button>
        <button type="button" id="mPrev" aria-label="前一月">‹ 月</button><button type="button" id="mNext" aria-label="後一月">月 ›</button>
        <button type="button" id="today">今天</button>
        <select id="fDec" aria-label="切換大限"></select>
        <label class="chk"><input type="checkbox" id="fMini">極簡星盤</label>
      </div>
      <div id="scopeTabs" role="group" aria-label="星盤類型">
        <button type="button" data-sc="base">基本星盤</button>
        <button type="button" data-sc="decadal">大運星盤</button>
        <button type="button" data-sc="yearly">流年星盤</button>
        <button type="button" data-sc="monthly">流月星盤</button>
        <button type="button" data-sc="daily">流日星盤</button>
      </div>
      <div class="chartscroll"><div id="chart"></div></div>
    </section>
  </div>

  <section class="box book">
    <h2>命書輸出（可單選或複選）</h2>
    <div id="menu"></div>
    <div class="btns"><button class="btn" type="button" id="gen">產製命書</button><button class="btn ghost" type="button" id="copy">複製命書文字</button></div>

  const xs = (BR.indexOf(yb) - STEMS.indexOf(ys) + 12) % 12, pair = [(xs+10)%12, (xs+11)%12];
  const xk = BR[pair.find(b => b%2 !== BR.indexOf(yb)%2)];

  a.palaces.find(p=>p.earthlyBranch===jk).adjectiveStars.push({name:'截空',type:'adjective',scope:'origin'});

  if (ma) a.palaces.find(p=>p.earthlyBranch===maBranch).minorStars.push(ma);

const CN = {'〇':0,'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10,'正':1,'冬':11,'臘':12};
function parseLunarMD(str){
  const m = str.match(/年(閏?)(.+?)月(.+)$/); if(!m) return null;
  const mon = m[2]==='十'?10: m[2].length===2 ? 10+CN[m[2][1]] : CN[m[2]];
  let d = m[3].replace('初',''), day;
  if (d==='十') day=10; else if (d==='二十'||d==='廿') day=20; else if (d==='三十') day=30;
  else if (d[0]==='十') day=10+CN[d[1]]; else if (d[0]==='廿') day=20+CN[d[1]]; else if (d[0]==='三'&&d.length===2) day=30+CN[d[1]]; else day=CN[d];
  return {mon, day};
}
const LUCUN = {'甲':'寅','乙':'卯','丙':'巳','丁':'午','戊':'巳','己':'午','庚':'申','辛':'酉','壬':'亥','癸':'子'};
function computeYearGods(){
  const a=S.a, h=S.h, BR='子丑寅卯辰巳午未申酉戌亥';
  const bl=a.rawDates.lunarDate, now=parseLunarMD(h.lunarDate);
  let age=h.age.nominalAge; if(now && (now.mon>bl.lunarMonth || (now.mon===bl.lunarMonth && now.day>=bl.lunarDay))) age+=1;
  let xi=a.palaces.findIndex(p=>p.ages.includes(age)); if(xi<0) xi=h.age.index;
  const stem=a.palaces[xi].heavenlyStem, lc=BR.indexOf(LUCUN[stem]);
  const ty=BR.indexOf(h.yearly.earthlyBranch), hr=(+S.cur.hour)%12;
  const at = b => a.palaces.findIndex(p=>p.earthlyBranch===BR[(b+24)%12]);
  const gods={}; const add=(b,n)=>{ const i=at(b); (gods[i]=gods[i]||[]).push(n); };
  add(ty,'太歲'); add(ty+4,'官符'); add(ty+8,'白虎'); add(ty-(bl.lunarMonth-1)+hr,'斗君');
  add(lc,'小祿'); add(lc+1,'小羊'); add(lc-1,'小陀');
  S.xl = {age, idx:xi, stem, gods, mut:T()[stem].map((star,k)=>({hua:HUA_NAME[k],star,to:a.loc?.[star]}))};
}

function brightNote(s){ if(!s.brightness) return ''; if(GOOD_BRIGHT.includes(s.brightness)) return `${s.name}${s.brightness}，力量發揮充分。`; if(BAD_BRIGHT.includes(s.brightness)) return `${s.name}落${s.brightness}，力量受限，優點需後天努力才能展現。`; return ''; }
function palaceText(i){
  const p = P(i), kind = PALACE_INFO[p.name].k;
  let majors = p.majorStars.filter(s=>STARS[s.name]), borrowed = false;
  if (!majors.length){ majors = P(i+6).majorStars.filter(s=>STARS[s.name]); borrowed = true; }
  let t = borrowed ? `本宮無主星，借對宮（${P(i+6).name}）${majors.map(s=>s.name).join('、')}來看，力量較弱，易受外在環境影響。` : '';
  majors.forEach(s=>{ t += `<b>${s.name}</b>：${STARS[s.name][kind]}`; if(!borrowed) t += brightNote(s); });
  const lk = p.minorStars.filter(s=>LUCKY.includes(s.name)||s.name==='祿存'||s.name==='天馬').map(s=>s.name);
  const sh = p.minorStars.filter(s=>SHA.includes(s.name)).map(s=>s.name);
  if (lk.length) t += `會${lk.join('、')}，${lk.map(n=>MINOR_DESC[n].replace(/^.*?，/,'')).join('')}`;
  if (sh.length) t += `逢${sh.join('、')}，${sh.map(n=>MINOR_DESC[n].replace(/^.*?，/,'')).join('')}`;
  return t;
}
function scoreOf(i, sc=null, h=S.h){ // 占驗派三方四正吉凶評分
  let s = 0; const fs = sanfang(i), scm = sc ? scopeMut(sc,h) : [];
  const bh = birthHua();
  fs.forEach((j,k)=>{
    const w = k===0?1:0.6, p=P(j);
    p.majorStars.forEach(x=>{ if(GOOD_BRIGHT.includes(x.brightness)) s+=0.5*w; if(BAD_BRIGHT.includes(x.brightness)) s-=0.5*w; });
    p.minorStars.forEach(x=>{ if(LUCKY.includes(x.name)||x.name==='祿存') s+=1*w; if(SHA.includes(x.name)) s-=1*w; });
    if (sc) (h[sc].stars?.[j]||[]).forEach(x=>{ if(/羊|陀/.test(x.name)) s-=0.8*w; if(/祿|昌|曲|魁|鉞/.test(x.name)) s+=0.6*w; });
    scm.forEach(m=>{ if(m.to===j) s += (m.hua==='忌'?-2:1.2)*w; });
    Object.entries(bh).forEach(([hua,v])=>{ if(v.to===j) s += (hua==='忌'?-1:0.6)*w; });
  });
  return Math.round(s*10)/10;
}

function qtPhenomena(sc){
  const h=S.h, li0=h[sc].index, lifeStem=h[sc].heavenlyStem, it=[];
  const nameOf=j=>scopeName(sc,j);
  ['命宮','財帛','官祿','夫妻'].forEach(n=>{ const i=S.a.palaces.findIndex((p,k)=>nameOf(k)===n); const stem=P(i).heavenlyStem;
    T()[stem].forEach((star,k)=>{ const hua=HUA_NAME[k]; if(hua!=='祿'&&hua!=='忌') return; const to=S.a.loc[star]; if(to===undefined) return;
      it.push(`${SCOPE_PREFIX[sc]}${n}（${stem}干）`+flyText(i,{hua,star,to},nameOf).replace(/^[^化]*/,'')); }); });
  const m = scopeMut(sc), ji=m.find(x=>x.hua==='忌'), bh=birthHua();
  if (ji && bh['忌'] && ji.to===bh['忌'].to) it.push(`<b>忌星疊併</b>：${SCOPES[sc]}化忌與生年化忌同落${P(ji.to).name}，此期間${PALACE_INFO[P(ji.to).name].short}之事壓力加重，宜保守應對。`);
  const lu=m.find(x=>x.hua==='祿'); if (lu && bh['祿'] && lu.to===bh['祿'].to) it.push(`<b>祿星疊併</b>：${SCOPES[sc]}化祿與生年化祿同落${P(lu.to).name}，${PALACE_INFO[P(lu.to).name].short}方面有加倍的收穫機會。`);
  if (lu && ji && lu.to===ji.to) it.push(`<b>祿忌同宮</b>：${SCOPES[sc]}祿忌同在${P(lu.to).name}，先得後失，宜見好就收。`);
  return it;
}
function zyPhenomena(sc){
  const h=S.h, i=h[sc].index, sf=sanfang(i), score=scoreOf(i,sc), [lb]=scoreLabel(score), it=[];
  const m = mainNames(P(i)).length?mainNames(P(i)):mainNames(P(i+6));
  it.push(`${SCOPES[sc]}命宮落在本命${P(i).name}（${P(i).heavenlyStem}${P(i).earthlyBranch}），主星${m.join('、')}：這段期間的重心偏向「${PALACE_INFO[P(i).name].象}」，${m.map(n=>STARS[n].key).join('；')}的特質會被放大。`);
  const lk=[],sh=[]; sf.forEach(j=>[...P(j).minorStars,...(h[sc].stars?.[j]||[])].forEach(s=>{ if(LUCKY.includes(s.name)||/祿|昌|曲|魁|鉞/.test(s.name)) lk.push(s.name); if(SHA.includes(s.name)||/羊|陀/.test(s.name)) sh.push(s.name); }));
  it.push(`三方四正吉曜：${lk.join('、')||'無'}；煞曜：${sh.join('、')||'無'}。綜合評分 <b>${score}</b>（${lb}）。`);
  const yang=(h[sc].stars||[]).findIndex(arr=>arr.some(s=>/羊$/.test(s.name))), tuo=(h[sc].stars||[]).findIndex(arr=>arr.some(s=>/陀$/.test(s.name)));
  if (yang>=0) it.push(`${SCOPES[sc]}擎羊在${SCOPE_PREFIX[sc]}${scopeName(sc,yang)}，此宮事項易有競爭衝突；陀羅在${SCOPE_PREFIX[sc]}${scopeName(sc,tuo)}，此宮事項易拖延反覆。`);
  it.push(score>=1.5?'整體運勢順遂，宜積極進取、擴展格局。':score<=-1?'運勢阻力較多，宜守成、避免大型投資與冒險。':'運勢平穩，按部就班即可，遇機會再出手。');
  return it;
}

      if(sanfang(sp).some(j=>P(j).boshi12==='青龍')) r.push('夫妻宮三方四正有青龍，一生有婚姻緣分。');
      if(allNames(P(idx('子女'))).includes('咸池')) r.push('子女宮有咸池，主有婚姻與子女緣。');
      if(P(sp).minorStars.some(s=>['左輔','右弼'].includes(s.name))) r.push('夫妻宮有左輔或右弼，感情上容易出現第三者或同時有兩段緣分，宜專一。');
      if(!r.length) r.push(`夫妻宮${mainsOrBorrow(sp).join('、')}，${mainsOrBorrow(sp).map(n=>STARS[n].spouse).join('')}`); return r; },
    decade:o=>{ const r=[]; const di=o.h.decadal.index, dsp=rel(di,2);
      if (mutTo(o.dm,'祿',dsp)) r.push('大限命宮宮干化祿進入大限夫妻宮'); if (lc===dsp) r.push('本命祿存在大限夫妻宮'); if (mutTo(o.dm,'祿',sp)) r.push('大限化祿入本命夫妻宮'); return r; },
    year:o=>{ const r=[], ysp=yName(o,'夫妻'), luan=ystar(o,/鸞$/);
      if (o.li===hl) r.push('太歲走到本命紅鸞位'); if (o.li===tx) r.push('太歲走到本命天喜位'); if (o.li===sp) r.push('太歲走到本命夫妻宮');
      if (luan===idx('命宮')) r.push('流年紅鸞入本命命宮'); if (luan===sp) r.push('流年紅鸞入本命夫妻宮'); if (luan===bi) r.push('流年紅鸞入身宮');
      if (mutTo(o.ym,'祿',ysp)) r.push('流年夫妻宮有化祿進入'); if (mutTo(o.ym,'權',ysp)) r.push('流年夫妻宮有化權進入'); if (lc===ysp) r.push('流年夫妻宮有祿存');
      if (o.xl){ const xsp=rel(o.xl.idx,2); if (o.xl.idx===sp) r.push('小限走到本命夫妻宮'); if (o.xl.idx===hl) r.push('小限走到本命紅鸞位');
        if (mutTo(o.xl.mut,'祿',xsp)) r.push('小限夫妻宮有化祿進入'); if (mutTo(o.xl.mut,'權',xsp)) r.push('小限夫妻宮有化權進入'); if (lc===xsp) r.push('小限夫妻宮有祿存'); }
      return r; },
    advice:'只要出現任一項徵象即列為紅鸞星動之年；同一年條件越多，成婚或認識對象的機會越大。'
  }));
};
R.l05 = ()=>{ const cb=idx('財帛'), fd=idx('福德'), td=idx('田宅');
  return sec('論破財時機', `<p class="muted">一生財富有先天的格局，也有後天可以調整的空間；先找出容易破財的時間點，提早預防。</p>`+lifeReport({
    natal:()=>{ const r=[], bh=birthHua(); [cb,td].forEach(i=>fly(i).forEach(f=>{ if(f.to===i&&f.hua==='忌') r.push(`本命${P(i).name}自化忌，錢財不易守住，宜強制儲蓄。`); }));
      if (bh['忌']&&[cb,fd].includes(bh['忌'].to)) r.push(`生年化忌在${P(bh['忌'].to).name}${bh['忌'].to===fd?'，沖財帛':''}，一生理財宜保守。`);
      if (P(cb).minorStars.some(s=>['地空','地劫'].includes(s.name))) r.push('財帛宮見地空地劫，投資起伏大。'); return r.length?r:['未檢出先天破財徵象。']; },
    decade:o=>{ const r=[], di=o.h.decadal.index, dc=rel(di,4), dt=rel(di,9);
      [[dc,'大財'],[dt,'大田']].forEach(([i,n])=>fly(i).forEach(f=>{ if(f.to===i&&f.hua==='忌') r.push(`${n}有自化忌，這十年財庫有破，不宜大型投資`); }));
      if (mutTo(o.dm,'忌',cb)||mutTo(o.dm,'忌',fd)) r.push('大限化忌照本命財帛'); return r; },
    year:o=>{ const r=[], dc=rel(o.h.decadal.index,4), opp=(o.li+6)%12;
      if (fly(dc).some(f=>f.hua==='忌'&&f.to===opp)) r.push('大財忌沖流年命宮，有損財機會，不宜幫人作保');
      if (mutTo(o.ym,'忌',cb)) r.push('流年化忌入本命財帛'); if (mutTo(o.ym,'忌',fd)) r.push('流年化忌入福德沖財帛'); if (mutTo(o.ym,'忌',yName(o,'財帛'))) r.push('流年財帛宮逢化忌');
      if (P(o.li).minorStars.some(s=>['地空','地劫'].includes(s.name))) r.push('流年命宮逢空劫'); return r; },
    advice:'破財年份宜保守理財、避免借貸作保與高風險投資，可定期捐款行善、量入為出。'
  }));
};
R.l01 = ()=>{ const L=S.a.loc, gl=idx('官祿'), fm=idx('父母');
  return sec('論學歷與考試運', `<p>文昌在${P(L['文昌']).name}、文曲在${P(L['文曲']).name}；官祿宮${mainsOrBorrow(gl).join('、')}，父母宮（文書）${mainsOrBorrow(fm).join('、')}。</p>`+lifeReport({
    year:o=>{ const r=[]; if (mutTo(o.ym,['科','祿'],gl)) r.push('流年科祿入本命官祿'); if (mutTo(o.ym,'科',fm)) r.push('流年化科入父母（文書）'); if (mutTo(o.ym,'科',yName(o,'官祿'))) r.push('流年官祿宮逢化科');
      if ([L['文昌'],L['文曲']].includes(o.li)) r.push('太歲走到本命昌曲宮'); const c=ystar(o,/昌$/); if (c===o.li||c===yName(o,'官祿')) r.push('流昌入流年命官'); return r; },
    advice:'考試年宜提早準備證照或升學；遇化忌入官祿、父母之年，填表與文書要再三核對。'
  })); };
R.l04 = ()=>{ const ji=idx('疾厄'), fm=idx('父母'), m=mainsOrBorrow(ji), wx=[...new Set(m.flatMap(n=>[...STARS[n].wx]))];
  return sec('論身體病痛', `<p>疾厄宮${m.join('、')}：${m.map(n=>STARS[n].health).join('')}五行偏${wx.join('、')}，宜保養${wx.map(w=>ORGAN[w]).join('；')}。</p>`+lifeReport({
    decade:o=>{ const r=[]; if (mutTo(o.dm,'忌',ji)||mutTo(o.dm,'忌',fm)) r.push('大限化忌照疾厄，這十年宜注意保養'); return r; },
    year:o=>{ const r=[]; if (mutTo(o.ym,'忌',ji)) r.push('流年化忌入疾厄'); if (mutTo(o.ym,'忌',fm)) r.push('流年化忌沖疾厄'); if (mutTo(o.ym,'忌',yName(o,'疾厄'))) r.push('流年疾厄宮逢化忌');
      if (o.li===ji) r.push('太歲走到本命疾厄'); const y=ystar(o,/羊$/); if (y===yName(o,'疾厄')) r.push('流羊入流年疾厄'); return r; },
    advice:'命理僅供參考，身體不適請以醫師診斷為準；健康警示年宜安排檢查、作息規律。'
  })); };
R.l06 = ()=>{ const td=idx('田宅');
  return sec('論田宅及置產時機', `<p>田宅宮${mainsOrBorrow(td).join('、')}：${mainsOrBorrow(td).map(n=>STARS[n].property).join('')}</p>`+lifeReport({
    decade:o=>{ const r=[]; if (mutTo(o.dm,['祿','權'],td)) r.push('大限祿權入本命田宅，有置產機會'); if (mutTo(o.dm,['祿','權'],rel(o.h.decadal.index,9))) r.push('大限化祿權入大限田宅'); return r; },
    year:o=>{ const r=[]; if (mutTo(o.ym,['祿','權'],td)) r.push('流年祿權入本命田宅'); if (mutTo(o.ym,['祿','權'],yName(o,'田宅'))) r.push('流年田宅宮逢祿權'); if (o.li===td) r.push('太歲走到本命田宅'); return r; },
    advice:'置產年宜看屋簽約；若同年有化忌入田宅，交屋與貸款細節要多留意。'
  })); };
R.l07 = ()=>{ const gl=idx('官祿');
  return sec('論工作上之升遷機運', `<p>官祿宮${mainsOrBorrow(gl).join('、')}：${mainsOrBorrow(gl).map(n=>STARS[n].career).join('')}</p>`+lifeReport({
    decade:o=>{ const r=[]; if (mutTo(o.dm,['祿','權'],gl)) r.push('大限祿權入本命官祿，事業擴展期'); if (mutTo(o.dm,'忌',gl)||mutTo(o.dm,'忌',idx('夫妻'))) r.push('大限化忌照官祿，工作易有轉換'); return r; },
    year:o=>{ const r=[]; if (mutTo(o.ym,['權','祿'],gl)) r.push('流年祿權入本命官祿'); if (mutTo(o.ym,['權','祿'],yName(o,'官祿'))) r.push('流年官祿宮逢祿權'); if (o.li===gl) r.push('太歲走到本命官祿');
      const k=ystar(o,/魁$|鉞$/); if (k===o.li) r.push('流年魁鉞貴人入命'); return r; },
    advice:'升遷年宜主動爭取表現機會、接受新任務。'
  })); };
R.l08 = ()=>{ const gl=idx('官祿'), fm=idx('父母'), xing=S.a.loc['天刑'];
  return sec('論官非與訴訟機運', `<p>天刑在${P(xing).name}。化忌入官祿、父母（文書），或廉貞化忌照命，都是口舌官非的應期。</p>`+lifeReport({
    year:o=>{ const r=[]; if (mutTo(o.ym,'忌',gl)) r.push('流年化忌入本命官祿'); if (mutTo(o.ym,'忌',fm)) r.push('流年化忌入父母（文書）');
      const lz=o.ym.find(m=>m.hua==='忌'&&m.star==='廉貞'); if (lz && sanfang(o.li).includes(lz.to)) r.push('廉貞化忌照流年命宮');
      const y=ystar(o,/羊$/); if (y>=0 && y===xing) r.push('流羊與天刑同宮'); return r; },
    advice:'官非年簽約、報稅、交通罰單都要謹慎處理，遇糾紛以協商為先。'
  })); };
R.l09 = ()=>{ const qy=idx('遷移'), ji=idx('疾厄'), L=S.a.loc;
  return sec('論意外與車禍機運', `<p>遷移宮${allNames(P(qy)).filter(n=>SHA.includes(n)).join('、')||'無煞星'}，疾厄宮${allNames(P(ji)).filter(n=>SHA.includes(n)).join('、')||'無煞星'}。</p>`+lifeReport({
    year:o=>{ const r=[]; if (mutTo(o.ym,'忌',qy)) r.push('流年化忌入本命遷移'); if (mutTo(o.ym,'忌',ji)) r.push('流年化忌入疾厄'); if (mutTo(o.ym,'忌',yName(o,'遷移'))) r.push('流年遷移宮逢化忌');
      const y=ystar(o,/羊$/); if (y===o.li) r.push('流羊入流年命宮'); if (o.li===L['擎羊']) r.push('太歲走到本命擎羊位'); return r; },
    advice:'意外警示年出行放慢速度，避免高風險活動，開車不搶快。'
  })); };
R.l10 = ()=>{ const pu=idx('僕役'), xd=idx('兄弟'), L=S.a.loc;
  return sec('論貴人與小人機運', `<p>天魁在${P(L['天魁']).name}、天鉞在${P(L['天鉞']).name}、左輔在${P(L['左輔']).name}、右弼在${P(L['右弼']).name}；僕役宮${mainsOrBorrow(pu).join('、')}：${mainsOrBorrow(pu).map(n=>STARS[n].kin).join('')}</p>`+lifeReport({
    year:o=>{ const r=[]; if (mutTo(o.ym,['祿','科'],pu)) r.push('貴人：流年祿科入僕役'); const k=ystar(o,/魁$|鉞$/); if (k===o.li) r.push('貴人：流年魁鉞入命');
      if (mutTo(o.ym,'忌',pu)) r.push('小人：流年化忌入僕役'); if (mutTo(o.ym,'忌',xd)) r.push('小人：流年化忌入兄弟'); return r; },
    advice:'貴人年多參與聚會、拓展人脈；小人年避免借貸作保，人際界線要清楚。'
  })); };

init();
$('#gen').onclick = ()=>{ const b=$('#gen'); b.disabled=true; b.textContent='命書產製中…'; setTimeout(()=>{ try{ genReport(true); } finally { b.disabled=false; b.textContent='產製命書'; } }, 30); };
</script></body></html>

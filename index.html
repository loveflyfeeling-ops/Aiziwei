<style>

:root[data-theme="dark"]{

body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6}
.wrap{max-width:1280px;margin:0 auto;padding:20px 16px 48px;display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
.top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 20px;border-bottom:1px solid var(--line);padding-bottom:12px}

.main{display:grid;grid-template-columns:280px minmax(0,1fr);gap:20px;align-items:start}

.h-祿{background:var(--lu)} .h-權{background:var(--quan)} .h-科{background:var(--ke)} .h-忌{background:var(--ji)}

.hua.in::before{content:"↓"}
.hua.in.h-祿{color:var(--lu)} .hua.in.h-權{color:var(--quan)} .hua.in.h-科{color:var(--ke)} .hua.in.h-忌{color:var(--ji)}
.hua.self.h-祿,.hua.sc.h-祿{color:var(--lu)} .hua.self.h-權,.hua.sc.h-權{color:var(--quan)} .hua.self.h-科,.hua.sc.h-科{color:var(--ke)} .hua.self.h-忌,.hua.sc.h-忌{color:var(--ji)}
.hua.sc{border-style:dashed}
.foot{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;gap:4px;font-size:.72rem;color:var(--muted);line-height:1.25;padding-top:4px;border-top:1px dotted var(--line)}
.pn{text-align:center;display:grid}
.pn b{font-family:var(--display);font-size:.98rem;color:var(--ink);letter-spacing:.08em}
.pn b em{font-style:normal;font-size:.68rem;background:var(--accent);color:var(--accent-ink);border-radius:3px;padding:0 3px;margin-left:3px;vertical-align:2px}
.pn .scn{font-size:.78rem;color:var(--accent);letter-spacing:0}
.gz{text-align:right;font-family:var(--serif);font-size:.8rem;color:var(--ink)}
.center{grid-row:2/4;grid-column:2/4;background:var(--paper);padding:14px 18px;display:flex;flex-direction:column;gap:6px;position:relative;isolation:isolate}
.center>*:not(svg){position:relative;z-index:1}
.cname{font-family:var(--display);font-size:1.5rem;font-weight:700;letter-spacing:.05em}
.cmeta{color:var(--muted);font-size:.85rem}
.center dl{display:grid;grid-template-columns:auto 1fr;gap:1px 12px;margin:4px 0;font-size:.86rem}
.center dt{color:var(--muted)} .center dd{margin:0;font-variant-numeric:tabular-nums}
.flybox{display:flex;background:color-mix(in srgb,var(--bg) 85%,transparent);flex-wrap:wrap;gap:4px 10px;font-size:.85rem;background:var(--bg);border-radius:6px;padding:8px 10px}
.flybox b{width:100%;font-family:var(--display)} .flybox small{width:100%;color:var(--muted)}
.flybox.hint{color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px;font-size:.75rem;color:var(--muted);margin-top:auto}
svg.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;opacity:.55}
svg.lines line{vector-effect:non-scaling-stroke;stroke-width:1.6}
.sfl{stroke:var(--accent);stroke-dasharray:4 3;opacity:.8}
.fl.f-祿{stroke:var(--lu)} .fl.f-權{stroke:var(--quan)} .fl.f-科{stroke:var(--ke)} .fl.f-忌{stroke:var(--ji);stroke-width:2.4}
/* 命書選單 */
.book{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
#menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
#menu fieldset{border:1px solid var(--line);border-radius:8px;margin:0;padding:8px 12px 10px;display:grid;gap:2px;min-width:0}
#menu legend{font-family:var(--display);font-weight:700;padding:0 4px;display:flex;gap:8px;align-items:center}
#menu legend span{display:flex;gap:4px}
#menu legend button{font-family:var(--sans);font-weight:400;font-size:.72rem;border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:4px;padding:0 6px}
#menu label{display:flex;align-items:flex-start;gap:6px;font-size:.88rem;cursor:pointer;line-height:1.45;padding:2px 0}
#menu input{margin-top:3px;accent-color:var(--accent)}
.tag{font-style:normal;font-size:.68rem;border-radius:3px;padding:1px 5px;margin-left:4px;white-space:nowrap;border:1px solid}
.tag.qt{color:var(--ke)} .tag.zy{color:var(--quan)}
/* 命書內容 */
#report{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;min-width:0}
.rh{border-bottom:2px solid var(--ink);padding-bottom:8px}
.rh h2{font-family:var(--display);font-size:1.6rem;margin:0}
.rh p{margin:4px 0 0;color:var(--muted);font-size:.88rem}
.gh{font-family:var(--display);font-size:1.25rem;margin:10px 0 0;color:var(--accent);letter-spacing:.08em}
.rs{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px 18px}
.rs h3{font-family:var(--display);font-size:1.1rem;margin:0 0 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rs h3 .tag{margin:0;font-family:var(--sans)}
.rs h4{font-family:var(--display);font-size:.98rem;margin:12px 0 4px}
.rs h4 small{font-family:var(--sans);font-weight:400;color:var(--muted);margin-left:8px;font-size:.8rem}

.pal{border-top:1px dotted var(--line);padding-top:4px}
.pal:first-of-type{border-top:0}
.pal p{margin:2px 0 6px}
.muted{color:var(--muted)}
.zy-note{background:var(--sf);border-radius:6px;padding:8px 12px}

.pat{border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:grid;gap:2px}

.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--soft);white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:.8rem}
tr.now td{background:var(--sel);font-weight:600}
td.bar{width:30%;min-width:100px}
td.bar span{display:block;height:8px;border-radius:4px}
td.bar .pos{background:var(--lu)} td.bar .neg{background:var(--ji)}
.lv{font-style:normal;font-size:.78rem;padding:1px 8px;border-radius:999px;border:1px solid}
.lv.g2,.lv.g1{color:var(--lu)} .lv.n{color:var(--muted)} .lv.b1,.lv.b2{color:var(--ji)}

.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}

.kv span{font-size:.78rem;color:var(--muted)} .kv b{font-family:var(--display);font-size:1.1rem}
.foot-note{font-size:.82rem}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important}}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>紫微斗數雙系統論命</h1>
      <p>欽天四化 × 占驗派・排盤、四化飛星與命書輸出</p>
    </div>
    <div class="school" role="radiogroup" aria-label="派別設定">
      <label><input type="radio" name="school" id="sc-both" value="both">雙系統</label>
      <label><input type="radio" name="school" id="sc-zy" value="zy">占驗派</label>
      <label><input type="radio" name="school" id="sc-qt" value="qt">欽天四化</label>
    </div>
  </header>

  <div class="main">
    <aside class="panel">
      <section class="box">
        <h2>問測者基本資料</h2>
        <form id="form">
          <label class="f">姓名<input id="fName" autocomplete="off"></label>
          <div class="row2">
            <label class="f">性別<select id="fGender"><option value="男">男</option><option value="女">女</option></select></label>
            <label class="f">曆法<select id="fCal"><option value="solar">國曆</option><option value="lunar">農曆</option></select></label>
          </div>
          <label class="f">出生日期<input id="fDate" type="date" min="1900-01-01" max="2100-12-31"></label>
          <label class="chk" id="leapWrap" hidden><input type="checkbox" id="fLeap">閏月</label>
          <label class="f">出生時辰<select id="fHour"></select></label>
          <div class="btns">
            <button class="btn" type="submit">排盤</button>
            <button class="btn ghost" type="button" id="saveCase">儲存問測者</button>
          </div>
          <p class="err" id="err" role="alert" hidden></p>
        </form>
      </section>
      <section class="box">
        <h2>問測者名單</h2>
        <ul id="caseList"></ul>
      </section>
    </aside>

    <section class="chartbox" aria-label="紫微斗數星盤">
      <div class="ref">
        <label for="fRef" class="muted">論命日期</label><input type="date" id="fRef">
        <button type="button" id="yPrev" aria-label="前一年">‹ 年</button><button type="button" id="yNext" aria-label="後一年">年 ›</button>
        <button type="button" id="mPrev" aria-label="前一月">‹ 月</button><button type="button" id="mNext" aria-label="後一月">月 ›</button>
        <button type="button" id="today">今天</button>
        <select id="fDec" aria-label="切換大限"></select>
        <label class="chk"><input type="checkbox" id="fMini">極簡星盤</label>
      </div>
      <div id="scopeTabs" role="group" aria-label="星盤類型">
        <button type="button" data-sc="base">基本星盤</button>
        <button type="button" data-sc="decadal">大運星盤</button>
        <button type="button" data-sc="yearly">流年星盤</button>
        <button type="button" data-sc="monthly">流月星盤</button>
        <button type="button" data-sc="daily">流日星盤</button>
      </div>
      <div class="chartscroll"><div id="chart"></div></div>
    </section>
  </div>

  <section class="box book">
    <h2>命書輸出（可單選或複選）</h2>
    <div id="menu"></div>
    <div class="btns"><button class="btn" type="button" id="gen">產製命書</button><button class="btn ghost" type="button" id="copy">複製命書文字</button></div>
  </section>

  <div id="report" aria-live="polite"></div>
</div>

const showQT = () => S.school !== 'zy', showZY = () => S.school !== 'qt';

/* ---------- 排盤 ---------- */
function compute(){
  const c = S.cur;
  const a = c.cal === 'lunar'
    ? iztro.astro.byLunar(c.date, +c.hour, c.gender, !!c.leap, true, 'zh-TW')
    : iztro.astro.bySolar(c.date, +c.hour, c.gender, true, 'zh-TW');
  S.a = a; S.h = a.horoscope(S.refDate, +c.hour);
  // 天馬依農曆生月安星（以網站為準）：寅午戌月在申、申子辰月在寅、巳酉丑月在亥、亥卯未月在巳
  const mb = (a.rawDates.lunarDate.lunarMonth + 1) % 12; // 月支：正月寅=2
  const maBranch = {2:'申',6:'申',10:'申',8:'寅',0:'寅',4:'寅',5:'亥',9:'亥',1:'亥',11:'巳',3:'巳',7:'巳'}[mb];
  let ma = null;
  a.palaces.forEach(p=>{ const k=p.minorStars.findIndex(s=>s.name==='天馬'); if(k>=0) ma=p.minorStars.splice(k,1)[0]; });
  if (ma) a.palaces.find(p=>p.earthlyBranch===maBranch).minorStars.push(ma);
  // 索引
  a.byName = {}; a.loc = {};
  a.palaces.forEach((p,i)=>{
    a.byName[p.name] = i;
    [...p.majorStars, ...p.minorStars, ...p.adjectiveStars].forEach(s => { a.loc[s.name] = i; });
  });
  a.birthYear = +a.solarDate.split('-')[0];
}
const P = i => S.a.palaces[(i+12)%12];
const idx = name => S.a.byName[name];
const sanfang = i => [i, (i+4)%12, (i+8)%12, (i+6)%12];
const mainNames = p => p.majorStars.filter(s=>STARS[s.name]).map(s=>s.name);
const allNames = p => [...p.majorStars, ...p.minorStars, ...p.adjectiveStars].map(s=>s.name);
function fly(i){ // 宮干飛化
  const stem = P(i).heavenlyStem;
  return SIHUA_TABLE[stem].map((star,k)=>({hua:HUA_NAME[k], star, to:S.a.loc[star]}));
}
function birthHua(){ // 生年四化落宮
  const out = {};
  S.a.palaces.forEach((p,i)=>[...p.majorStars,...p.minorStars].forEach(s=>{ if(s.mutagen) out[s.mutagen] = {star:s.name, to:i}; }));
  return out;
}
function scopeMut(sc, h=S.h){ // 運限四化落宮
  return h[sc].mutagen.map((star,k)=>({hua:HUA_NAME[k], star, to:S.a.loc[star]}));
}
function scopeName(sc, i, h=S.h){ return h[sc].palaceNames[i]; }
function hYear(y){ return S.a.horoscope(new Date(y, 7, 15), +S.cur.hour); }

/* ---------- 星盤繪製 ---------- */
function badge(h, cls=''){ return `<i class="hua h-${h} ${cls}">${h}</i>`; }
function renderChart(){
  const a = S.a, h = S.h, sc = S.scope, bh = birthHua();
  const selfMap = {}, inMap = {};
  if (showQT()) a.palaces.forEach((p,i)=>fly((i+6)%12).forEach(f=>{ if(f.to===i){ (inMap[i]=inMap[i]||{})[f.star]=(inMap[i][f.star]||'')+f.hua; } }));
  if (showQT()) a.palaces.forEach((p,i)=>fly(i).forEach(f=>{ if(f.to===i){ (selfMap[i]=selfMap[i]||{})[f.star]=(selfMap[i][f.star]||'')+f.hua; } }));
  const scMut = {}; if (sc!=='base') scopeMut(sc).forEach(m=>{ scMut[m.star]=m.hua; });
  let cells = '';
  a.palaces.forEach((p,i)=>{
    const [r,c] = GRID_POS[i];
    const starHtml = (s, major) => {
      const self = selfMap[i]?.[s.name] || '';
      return `<span class="st ${major?'maj':'min'} ${SHA.includes(s.name)?'sha':''} ${LUCKY.includes(s.name)||s.name==='祿存'?'luck':''}">${s.name}${s.brightness?`<sub>${s.brightness}</sub>`:''}${s.mutagen?badge(s.mutagen):''}${scMut[s.name]?badge(scMut[s.name],'sc'):''}${[...self].map(x=>badge(x,'self')).join('')}${[...(inMap[i]?.[s.name]||'')].map(x=>badge(x,'in')).join('')}</span>`;
    };
    const maj = p.majorStars.map(s=>starHtml(s,true)).join('');
    const min = p.minorStars.map(s=>starHtml(s,false)).join('');
    const adj = p.adjectiveStars.map(s=>s.name).join(' ');
    const scStars = sc!=='base' ? (h[sc].stars?.[i]||[]).map(s=>s.name).join(' ') : '';
    const scName = sc!=='base' ? `<b class="scn">${SCOPE_PREFIX[sc]}${scopeName(sc,i).replace('宮','')}</b>` : '';
    const isScopeLife = sc!=='base' && h[sc].index===i;
    const cls = ['cell', S.sel===i?'sel':'', S.sel!==null && sanfang(S.sel).includes(i) && S.sel!==i ? 'sf':'', isScopeLife?'life':''].join(' ');
    cells += `<button class="${cls}" style="grid-row:${r+1};grid-column:${c+1}" data-i="${i}" aria-label="${p.name}">
      <div class="stars">${maj||'<span class="empty">無主星</span>'}</div>
      <div class="minors">${min}</div>
      ${S.mini?'':`<div class="adj">${adj}</div>`}
      ${scStars?`<div class="scs">${scStars}</div>`:''}
      <div class="foot"><span class="cs">${S.mini?'':`${p.changsheng12}<br>${p.boshi12}`}</span>
        <span class="pn">${scName}<b>${p.name}${p.isBodyPalace?'<em>身</em>':''}</b><small>${p.decadal.range.join('–')}・小限${p.ages[0]}</small></span>
        <span class="gz">${p.heavenlyStem}<br>${p.earthlyBranch}</span></div>
    </button>`;
  });
  const dec = h.decadal, yr = h.yearly;
  const flyBox = S.sel!==null ? (()=>{
    const p = P(S.sel);
    return `<div class="flybox"><b>${p.name}（${p.heavenlyStem}${p.earthlyBranch}）宮干飛化</b>${fly(S.sel).map(f=>`<span>${badge(f.hua)}${f.star}→${f.to===undefined?'—':(f.to===S.sel?'自化':P(f.to).name)}</span>`).join('')}<small>三方四正：${sanfang(S.sel).slice(1).map(j=>P(j).name).join('、')}</small></div>`;
  })() : `<div class="flybox hint">點選任一宮位，可看三方四正${showQT()?'與宮干飛化':''}</div>`;
  const center = `<div class="center"><svg class="lines" viewBox="0 0 200 200" preserveAspectRatio="none" aria-hidden="true">${lineSvg()}</svg>
    <div class="cname">${esc(S.cur.name)}</div>
    <div class="cmeta">${S.cur.gender==='男'?'乾造':'坤造'}・${a.chineseDate.split(' ')[0]}年生・屬${a.zodiac}</div>
    <dl>
      <dt>國曆</dt><dd>${a.solarDate} ${a.time}</dd>
      <dt>農曆</dt><dd>${a.lunarDate}</dd>
      <dt>八字</dt><dd>${a.chineseDate}</dd>
      <dt>五行局</dt><dd>${a.fiveElementsClass}</dd>
      <dt>命主／身主</dt><dd>${a.soul}／${a.body}</dd>
      <dt>論命日</dt><dd>${fmtDate(S.refDate)}・虛歲 ${h.age.nominalAge}</dd>
      <dt>大限</dt><dd>${dec.heavenlyStem}${dec.earthlyBranch}（${P(dec.index).decadal.range.join('–')}歲）</dd>
      <dt>流年</dt><dd>${yr.heavenlyStem}${yr.earthlyBranch}年・流年命宮在${P(yr.index).name}</dd>
    </dl>
    ${flyBox}
    <div class="legend">${HUA_NAME.map(x=>badge(x)+'生年').join(' ')}${showQT()?` <span>${badge('祿','self')}離心自化</span> <span>${badge('祿','in')}向心自化</span>`:''}${sc!=='base'?` <span>${badge('祿','sc')}${SCOPES[sc]}四化</span>`:''}</div>
  </div>`;
  $('#chart').innerHTML = cells + center;
  $('#chart').querySelectorAll('.cell').forEach(b=>b.onclick=()=>{ const i=+b.dataset.i; S.sel = S.sel===i?null:i; renderChart(); });
  document.querySelectorAll('#scopeTabs button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.sc===sc));
}
function anchor(i){ const [r,c]=GRID_POS[i]; const cl=v=>Math.min(300,Math.max(100,v))-100; return [cl((c+.5)*100), cl((r+.5)*100)]; }
function lineSvg(){
  if (S.sel===null) return '';
  const [x0,y0] = anchor(S.sel); let s='';
  sanfang(S.sel).slice(1).forEach(j=>{ const [x,y]=anchor(j); s+=`<line class="sfl" x1="${x0}" y1="${y0}" x2="${x}" y2="${y}"/>`; });
  if (showQT()) fly(S.sel).forEach((f,k)=>{ if(f.to===undefined||f.to===S.sel) return; const [x,y]=anchor(f.to); const o=(k-1.5)*3; s+=`<line class="fl f-${f.hua}" x1="${x0+o}" y1="${y0+o}" x2="${x+o}" y2="${y+o}"/>`; });
  return s;
}
function fmtDate(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }

/* ---------- 論述工具 ---------- */
function brightNote(s){ if(!s.brightness) return ''; if(GOOD_BRIGHT.includes(s.brightness)) return `${s.name}${s.brightness}，力量發揮充分。`; if(BAD_BRIGHT.includes(s.brightness)) return `${s.name}落${s.brightness}，力量受限，優點需後天努力才能展現。`; return ''; }
function palaceText(i){
  const p = P(i), kind = PALACE_INFO[p.name].k;
  let majors = p.majorStars.filter(s=>STARS[s.name]), borrowed = false;
  if (!majors.length){ majors = P(i+6).majorStars.filter(s=>STARS[s.name]); borrowed = true; }
  let t = borrowed ? `本宮無主星，借對宮（${P(i+6).name}）${majors.map(s=>s.name).join('、')}來看，力量較弱，易受外在環境影響。` : '';
  majors.forEach(s=>{ t += `<b>${s.name}</b>：${STARS[s.name][kind]}`; if(!borrowed) t += brightNote(s); });
  const lk = p.minorStars.filter(s=>LUCKY.includes(s.name)||s.name==='祿存'||s.name==='天馬').map(s=>s.name);
  const sh = p.minorStars.filter(s=>SHA.includes(s.name)).map(s=>s.name);
  if (lk.length) t += `會${lk.join('、')}，${lk.map(n=>MINOR_DESC[n].replace(/^.*?，/,'')).join('')}`;
  if (sh.length) t += `逢${sh.join('、')}，${sh.map(n=>MINOR_DESC[n].replace(/^.*?，/,'')).join('')}`;
  return t;
}
function scoreOf(i, sc=null, h=S.h){ // 占驗派三方四正吉凶評分
  let s = 0; const fs = sanfang(i), scm = sc ? scopeMut(sc,h) : [];
  const bh = birthHua();
  fs.forEach((j,k)=>{
    const w = k===0?1:0.6, p=P(j);
    p.majorStars.forEach(x=>{ if(GOOD_BRIGHT.includes(x.brightness)) s+=0.5*w; if(BAD_BRIGHT.includes(x.brightness)) s-=0.5*w; });
    p.minorStars.forEach(x=>{ if(LUCKY.includes(x.name)||x.name==='祿存') s+=1*w; if(SHA.includes(x.name)) s-=1*w; });
    if (sc) (h[sc].stars?.[j]||[]).forEach(x=>{ if(/羊|陀/.test(x.name)) s-=0.8*w; if(/祿|昌|曲|魁|鉞/.test(x.name)) s+=0.6*w; });
    scm.forEach(m=>{ if(m.to===j) s += (m.hua==='忌'?-2:1.2)*w; });
    Object.entries(bh).forEach(([hua,v])=>{ if(v.to===j) s += (hua==='忌'?-1:0.6)*w; });
  });
  return Math.round(s*10)/10;
}
const scoreLabel = s => s>=4?['大吉','g2']:s>=1.5?['吉','g1']:s>-1?['平','n']:s>-3?['小心','b1']:['凶','b2'];
function sec(title, body, tag=''){ return `<section class="rs"><h3>${tag?`<span class="tag ${tag==='欽天四化'?'qt':'zy'}">${tag}</span>`:''}${title}</h3>${body}</section>`; }
function li(arr){ return arr.length?`<ul>${arr.map(x=>`<li>${x}</li>`).join('')}</ul>`:'<p class="muted">無明顯徵象。</p>'; }
function flyText(fromI, f, nameOf=(j)=>P(j).name){
  if (f.to===undefined) return '';
  const from = nameOf(fromI), to = nameOf(f.to), opp = OPP[to];
  if (f.to===fromI) return `${from}宮干化${f.hua}（${f.star}）自化：${SELF_HUA[f.hua].split('：')[1]}`;
  let t = `${from}化${f.hua}入${to}（${f.star}）：${PALACE_INFO[from]?.short||from}${FLY_VERB[f.hua]}${PALACE_INFO[to]?.short||to}。`;
  if (f.hua==='忌') t += `忌入${to}即沖${opp}，${PALACE_INFO[opp].short}方面易受衝擊。`;
  return t;
}

const R = {};
R.b01 = ()=> sec('先天十二宮星宿分析', S.a.palaces.map((p,i)=>`<div class="pal"><h4>${p.name}<small>${p.heavenlyStem}${p.earthlyBranch}・${PALACE_INFO[p.name].象}</small></h4><p>${palaceText(i)}</p></div>`).join(''));
R.b02 = ()=>{
  const a=S.a, mi=idx('命宮'), bi=a.palaces.findIndex(p=>p.isBodyPalace), m=P(mi);
  const sc = scoreOf(mi), [lb] = scoreLabel(sc);
  const ms = mainNames(m).length?mainNames(m):mainNames(P(mi+6));
  const firstAge = parseInt(a.fiveElementsClass.match(/[二三四五六]/)?{二:2,三:3,四:4,五:5,六:6}[a.fiveElementsClass.match(/[二三四五六]/)[0]]:2);
  let t = `<p>命宮坐${m.earthlyBranch}，${mainNames(m).length?'主星'+mainNames(m).join('、'):'無主星，借對宮'+ms.join('、')}。${ms.map(n=>STARS[n].self).join('')}</p>`;
  t += `<p>身宮落在<b>${P(bi).name}</b>，代表中年以後的人生重心會轉向「${PALACE_INFO[P(bi).name].象}」。命主${a.soul}、身主${a.body}，可作為修身的參考星性。</p>`;
  t += `<p>${a.fiveElementsClass}：第一個大限從 ${firstAge} 歲起運。命宮三方四正（${sanfang(mi).slice(1).map(j=>P(j).name).join('、')}）綜合評分 <b>${sc}</b>，整體屬「${lb}」格局。</p>`;
  if (showZY()) t += `<p class="zy-note">占驗派看法：命宮的主星組合與三方吉煞決定一生的基調。${sc>=1.5?'吉星會照較多，一生較易得到助力，宜把握貴人運往上發展。':sc<=-1?'煞星會照較多，一生需靠自己打拼，經歷磨練後反而更能成事。':'吉煞參半，成敗端看大限流年的配合。'}</p>`;

function zyPhenomena(sc){

R.l01 = ()=>{ const ys=scanYears(), p=P(idx('官祿')), f=P(idx('父母'));
  const loc=n=>P(S.a.loc[n]).name;
  return sec('論學歷與考試運', `<p>文昌在${loc('文昌')}、文曲在${loc('文曲')}；官祿宮主星${mainNames(p).join('、')||'空宮'}，父母宮（文書）主星${mainNames(f).join('、')||'空宮'}。${[idx('命宮'),idx('官祿'),idx('父母')].some(j=>['文昌','文曲'].includes(allNames(P(j)).find(n=>n==='文昌'||n==='文曲')))?'昌曲會入命、官或父母，讀書考試有天分。':'昌曲不在主要宮位，學業靠後天勤勉。'}</p><h4>考試有利年份</h4>`+yearList(ys,o=>hit(o.mut,'科','官祿')||hit(o.mut,'祿','官祿')||hit(o.mut,'科','父母')||hit(o.mut,'科','命宮'),o=>'：流年科祿照官祿／父母，利考試證照。')); };
R.l02 = ()=>{ const ys=scanYears(), hl=S.a.loc['紅鸞'], tx=S.a.loc['天喜'];
  return sec('論紅鸞星動與結婚機運', `<p>本命紅鸞在${P(hl).name}、天喜在${P(tx).name}。流年命宮走到紅鸞、天喜或本命夫妻宮，或流年化祿入夫妻宮時，是感情與婚姻的主要應期。</p>`+yearList(ys,o=>[hl,tx,idx('夫妻')].includes(o.li)||hit(o.mut,'祿','夫妻'),o=>`：${o.li===hl?'流年命逢紅鸞':o.li===tx?'流年命逢天喜':o.li===idx('夫妻')?'流年命宮走本命夫妻宮':'流年化祿入夫妻'}`)); };
R.l03 = ()=>{ const sp=idx('夫妻'), m=mainNames(P(sp)).length?mainNames(P(sp)):mainNames(P(sp+6)); const peach=[];
  ['命宮','夫妻','遷移','福德'].forEach(n=>{ const ps=allNames(P(idx(n))).filter(x=>PEACH.includes(x)); if(ps.length) peach.push(`${n}見${ps.join('、')}`); });
  const bh=birthHua(); let t=`<p>夫妻宮主星${m.join('、')}：${m.map(n=>STARS[n].spouse).join('')}</p><p>桃花星分布：${peach.join('；')||'桃花星不在主要宮位，感情較單純'}。${peach.length>=3?'桃花旺盛，異性緣佳，婚後宜注意界線。':''}</p>`;
  if (bh['忌']&&[sp,(sp+6)%12].includes(bh['忌'].to)) t+='<p>生年忌在夫妻或官祿（沖夫妻），婚姻需多經營，晚婚較能減少波折。</p>';
  t+=`<h4>婚姻宜留意的大限</h4>`+li(decadesWith((hh)=>scopeMut('decadal',hh).some(x=>x.hua==='忌'&&[sp,(sp+6)%12].includes(x.to))).map(x=>x+'：大限化忌入夫妻或沖夫妻，宜多溝通包容'));
  return sec('論婚姻與桃花運', t); };
R.l04 = ()=>{ const ji=idx('疾厄'), m=mainNames(P(ji)).length?mainNames(P(ji)):mainNames(P(ji+6)); const wx=[...new Set(m.flatMap(n=>[...STARS[n].wx]))]; const ys=scanYears();
  return sec('論身體病痛', `<p>疾厄宮${mainNames(P(ji)).length?'主星':'無主星，借對宮'}${m.join('、')}：${m.map(n=>STARS[n].health).join('')}五行偏${wx.join('、')}，宜保養${wx.map(w=>ORGAN[w]).join('；')}。${P(ji).minorStars.some(s=>SHA.includes(s.name))?'疾厄見煞，留意意外傷害或手術。':''}</p><h4>健康宜注意年份</h4>`+yearList(ys,o=>hit(o.mut,'忌','疾厄')||hit(o.mut,'忌','父母')||o.li===ji,o=>'：'+(hit(o.mut,'忌','疾厄')?'流年化忌入疾厄':hit(o.mut,'忌','父母')?'流年化忌沖疾厄':'流年命宮走疾厄')+'，宜安排健康檢查、作息規律')+'<p class="muted">命理僅供參考，身體不適請以醫師診斷為準。</p>'); };
R.l05 = ()=>{ const ys=scanYears(); return sec('論破財時機', `<p>化忌入財帛為財務緊縮、入福德則沖財帛，均為破財應期；地空地劫在${P(S.a.loc['地空']).name}、${P(S.a.loc['地劫']).name}。</p><h4>大限</h4>`+li(decadesWith(hh=>scopeMut('decadal',hh).some(x=>x.hua==='忌'&&[idx('財帛'),idx('福德')].includes(x.to))).map(x=>x+'：大限忌照財帛，十年間理財宜保守'))+'<h4>流年</h4>'+yearList(ys,o=>hit(o.mut,'忌','財帛')||hit(o.mut,'忌','福德'),o=>'：流年化忌照財帛，避免借貸、作保與高風險投資')); };
R.l06 = ()=>{ const ys=scanYears(); return sec('論田宅及置產時機', `<p>田宅宮主星${mainNames(P(idx('田宅'))).join('、')||'空宮'}：${(mainNames(P(idx('田宅'))).length?mainNames(P(idx('田宅'))):mainNames(P(idx('田宅')+6))).map(n=>STARS[n].property).join('')}</p><h4>置產有利大限</h4>`+li(decadesWith(hh=>scopeMut('decadal',hh).some(x=>(x.hua==='祿'||x.hua==='權')&&x.to===idx('田宅'))).map(x=>x+'：大限祿權入田宅'))+'<h4>置產有利年份</h4>'+yearList(ys,o=>hit(o.mut,'祿','田宅')||hit(o.mut,'權','田宅'),o=>'：流年祿權入田宅，宜購屋或裝修')); };
R.l07 = ()=>{ const ys=scanYears(), gl=idx('官祿'); return sec('論工作上之升遷機運', `<p>官祿宮${mainNames(P(gl)).join('、')||'空宮'}：${(mainNames(P(gl)).length?mainNames(P(gl)):mainNames(P(gl+6))).map(n=>STARS[n].career).join('')}</p><h4>升遷有利年份</h4>`+yearList(ys,o=>hit(o.mut,'權','官祿')||hit(o.mut,'祿','官祿')||o.li===gl,o=>`：${o.li===gl?'流年命宮走官祿':'流年祿權入官祿'}，爭取表現與升遷`)); };
R.l08 = ()=>{ const ys=scanYears(); const xing=S.a.loc['天刑']; return sec('論官非與訴訟機運', `<p>天刑在${P(xing).name}。化忌入官祿、僕役或父母（文書），或丙年廉貞化忌照命，皆為口舌官非的應期，簽約與報稅宜謹慎。</p>`+yearList(ys,o=>hit(o.mut,'忌','官祿')||hit(o.mut,'忌','父母')||(o.mut[3].star==='廉貞'&&sanfang(idx('命宮')).includes(o.mut[3].to)),o=>'：文書契約、法律事務多加留意')); };
R.l09 = ()=>{ const ys=scanYears(); return sec('論意外與車禍機運', `<p>遷移宮${allNames(P(idx('遷移'))).filter(n=>SHA.includes(n)).join('、')||'無煞星'}，疾厄宮${allNames(P(idx('疾厄'))).filter(n=>SHA.includes(n)).join('、')||'無煞星'}。流年化忌入遷移、疾厄，或流年擎羊入流年命宮時，交通與運動安全宜多注意。</p>`+yearList(ys,o=>hit(o.mut,'忌','遷移')||hit(o.mut,'忌','疾厄')||(o.h.yearly.stars[o.li]||[]).some(s=>s.name==='流羊'),o=>'：出行放慢速度，避免高風險活動')); };
R.l10 = ()=>{ const ys=scanYears(), L=S.a.loc; const pu=idx('僕役'); return sec('論貴人與小人機運', `<p>天魁在${P(L['天魁']).name}、天鉞在${P(L['天鉞']).name}、左輔在${P(L['左輔']).name}、右弼在${P(L['右弼']).name}，貴人多來自這些宮位代表的人事。僕役宮${mainNames(P(pu)).join('、')||'空宮'}：${(mainNames(P(pu)).length?mainNames(P(pu)):mainNames(P(pu+6))).map(n=>STARS[n].kin).join('')}</p><h4>貴人年</h4>`+yearList(ys,o=>hit(o.mut,'祿','僕役')||hit(o.mut,'科','僕役'),o=>'：朋友同事助力大')+'<h4>防小人年</h4>'+yearList(ys,o=>hit(o.mut,'忌','僕役')||hit(o.mut,'忌','兄弟'),o=>'：避免借貸作保，人際界線要清楚')); };

/* ---------- 知命造運 ---------- */
function lifeWx(){ const mi=idx('命宮'); const m=mainNames(P(mi)).length?mainNames(P(mi)):mainNames(P(mi+6)); return STARS[m[0]].wx[0]; }
R.k01 = ()=>{ const wx=lifeWx(), L=WX_LUCK[wx], yb=S.a.chineseDate.split(' ')[0][1];
  return sec('用紫微論幸運密碼與守護神', `<div class="kv"><div><span>命宮主星五行</span><b>${wx}</b></div><div><span>幸運數字</span><b>${L.num}</b></div><div><span>幸運色</span><b>${L.color}</b></div><div><span>有利方位</span><b>${L.dir}</b></div><div><span>開運小物</span><b>${L.item}</b></div><div><span>生肖守護神（${yb}年生）</span><b>${GUARDIAN[yb]}</b></div></div>`); };
R.k02 = ()=>{ const set=new Set(); ['命宮','官祿','財帛'].forEach(n=>{ const i=idx(n); (mainNames(P(i)).length?mainNames(P(i)):mainNames(P(i+6))).forEach(s=>set.add(s)); });
  return sec('用紫微論最有利的工作與職業', li([...set].map(n=>`<b>${n}</b>：${STARS[n].career}`))); };
R.k03 = ()=>{ const gl=idx('官祿'), fs=fly(gl), it=[];
  fs.forEach(f=>{ if(f.hua==='忌'||f.hua==='祿') it.push(flyText(gl,f)); });
  it.push(...decadesWith(hh=>scopeMut('decadal',hh).some(x=>x.hua==='忌'&&[gl,(gl+6)%12].includes(x.to))).map(x=>`${x}：大限忌照官祿，工作易有轉換或壓力加重`));
  it.push(...decadesWith(hh=>scopeMut('decadal',hh).some(x=>(x.hua==='祿'||x.hua==='權')&&x.to===gl)).map(x=>`${x}：大限祿權入官祿，事業擴展期`));
  return sec('用紫微論工作事業上的變化', li(it)); };
R.k04 = ()=>{ const mi=idx('命宮'), sf=sanfang(mi), ji=new Set(), sh=new Set(); sf.forEach(j=>P(j).minorStars.forEach(s=>{ if(LUCKY.includes(s.name)||s.name==='祿存') ji.add(s.name); if(SHA.includes(s.name)) sh.add(s.name); }));
  return sec('論一生吉星與凶星如何解之', `<p>命宮三方四正吉星：${[...ji].join('、')||'無'}。${[...ji].map(n=>MINOR_DESC[n]).join('')}</p><h4>凶星化解建議</h4>`+li([...sh].map(n=>`<b>${n}</b>：${SHA_ADVICE[n]}`))); };
R.k05 = ()=>{ const fd=idx('福德'), m=mainNames(P(fd)).length?mainNames(P(fd)):mainNames(P(fd+6));
  return sec('人生該注意之瑣事漫談', li([`福德宮${m.join('、')}：${m.map(n=>STARS[n].mind).join('')}`, `遷移宮${(mainNames(P(idx('遷移'))).length?mainNames(P(idx('遷移'))):mainNames(P(idx('命宮')))).map(n=>STARS[n].outside).join('')}`, '命盤呈現的是傾向與時機，真正的選擇在自己。吉運時積極把握，逆運時修身養性，就是知命造運的精神。'])); };

 {g:'大運分析', items:[['d01','大運十二宮星宿分析'],['d02','大運之四化現象'],['d03','欽天四化論本大運會發生之現象','qt'],['d04','占驗派論本大運現象','zy']]},

 {g:'一生機運預測', items:[['l01','論學歷與考試運'],['l02','論紅鸞星動與結婚機運'],['l03','論婚姻與桃花運'],['l04','論身體病痛'],['l05','論破財時機'],['l06','論田宅及置產時機'],['l07','論工作上之升遷機運'],['l08','論官非與訴訟機運'],['l09','論意外與車禍機運'],['l10','論貴人與小人機運']]},
 {g:'知命造運改變一生', items:[['k01','用紫微論幸運密碼與守護神'],['k02','用紫微論最有利的工作與職業'],['k03','用紫微論工作事業上的變化'],['k04','論一生吉星與凶星如何解之'],['k05','人生該注意之瑣事漫談']]}
];
function renderMenu(){
  const chosen = new Set(LS.get('zw-menu', ['b01','b02','b03','b05','d03','d04','y04','y05']));
  $('#menu').innerHTML = MENU.map((g,gi)=>`<fieldset><legend>${g.g}<span><button type="button" data-all="${gi}">全選</button><button type="button" data-none="${gi}">取消</button></span></legend>${g.items.map(([id,t,sch])=>`<label class="${sch||''}" ${sch==='qt'&&!showQT()||sch==='zy'&&!showZY()?'hidden':''}><input type="checkbox" id="m-${id}" value="${id}" ${chosen.has(id)?'checked':''}>${t}${sch?`<i class="tag ${sch}">${sch==='qt'?'欽天':'占驗'}</i>`:''}</label>`).join('')}</fieldset>`).join('');
  $('#menu').querySelectorAll('[data-all],[data-none]').forEach(b=>b.onclick=()=>{ const fs=b.closest('fieldset'); fs.querySelectorAll('label:not([hidden]) input').forEach(c=>c.checked=!!b.dataset.all); saveMenu(); });
  $('#menu').onchange = saveMenu;
}
function saveMenu(){ LS.set('zw-menu', [...document.querySelectorAll('#menu input:checked')].map(c=>c.value)); }
function genReport(scroll=true){
  const ids = [...document.querySelectorAll('#menu label:not([hidden]) input:checked')].map(c=>c.value);
  if (!ids.length){ $('#report').innerHTML = '<p class="muted">請先勾選要輸出的命書項目。</p>'; return; }
  let html = `<header class="rh"><h2>${esc(S.cur.name)} 命書</h2><p>${S.cur.gender==='男'?'乾造':'坤造'}・國曆 ${S.a.solarDate}・農曆 ${S.a.lunarDate} ${S.a.time}・${S.a.fiveElementsClass}・論命日 ${fmtDate(S.refDate)}・派別：${{both:'雙系統',zy:'占驗派',qt:'欽天四化'}[S.school]}</p></header>`;
  MENU.forEach(g=>{ const its=g.items.filter(([id])=>ids.includes(id)); if(!its.length) return; html += `<h2 class="gh">${g.g}</h2>` + its.map(([id])=>{ try{ return R[id](); }catch(e){ console.error(e); return sec('（此項目無法產生）',`<p class="muted">${esc(e.message)}</p>`); } }).join(''); });
  html += '<p class="muted foot-note">本命書由程式依紫微斗數傳統規則自動組合，內容供參考與自我覺察之用，重大決定請綜合實際情況判斷。</p>';
  $('#report').innerHTML = html; if (scroll===true) $('#report').scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
}

/* ---------- 問測者表單 ---------- */
function renderCases(){
  const list = [SAMPLE, ...S.cases];
  $('#caseList').innerHTML = list.map(c=>`<li><button type="button" data-id="${c.id}" aria-current="${S.cur&&S.cur.id===c.id}">${esc(c.name)}${c.sample?'<small>範例</small>':''}</button>${c.sample?'':`<button type="button" class="del" data-del="${c.id}" aria-label="刪除 ${esc(c.name)}">×</button>`}</li>`).join('');
  $('#caseList').querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{ const c=list.find(x=>x.id===b.dataset.id); loadCase(c); });
  $('#caseList').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ if(b.dataset.armed){ S.cases=S.cases.filter(x=>x.id!==b.dataset.del); LS.set('zw-cases',S.cases); renderCases(); } else { b.dataset.armed=1; b.textContent='確定刪除'; setTimeout(()=>{ if(b.isConnected){ delete b.dataset.armed; b.textContent='×'; } },3000); } });
}
function loadCase(c){
  S.cur = {...c};
  $('#fName').value=c.name; $('#fGender').value=c.gender; $('#fCal').value=c.cal; $('#fDate').value=c.date; $('#fLeap').checked=!!c.leap; $('#fHour').value=c.hour;
  $('#leapWrap').hidden = c.cal!=='lunar';
  S.sel=null; refresh(); renderCases();
}
function readForm(){ return {name:$('#fName').value.trim()||'未命名', gender:$('#fGender').value, cal:$('#fCal').value, date:$('#fDate').value, leap:$('#fLeap').checked, hour:+$('#fHour').value}; }
function refresh(){
  try { compute(); $('#err').hidden=true; renderDec(); renderChart(); $('#report').innerHTML=''; }
  catch(e){ console.error(e); $('#err').hidden=false; $('#err').textContent='無法排盤：請確認出生日期格式正確（農曆日期不可超過當月天數）。'; }
}

function renderDec(){
  const ds=S.a.palaces.map((p,i)=>({i,r:p.decadal.range})).sort((x,y)=>x.r[0]-y.r[0]);
  $('#fDec').innerHTML=ds.map((d,k)=>`<option value="${d.r[0]}" ${S.h.decadal.index===d.i?'selected':''}>第${k+1}大限 ${d.r.join('–')}歲</option>`).join('');
}
function init(){
  if (typeof iztro==='undefined'){ $('#err').hidden=false; $('#err').textContent='排盤引擎載入失敗，請重新整理頁面。'; return; }
  $('#fHour').innerHTML = HOURS.map((h,i)=>`<option value="${i}">${h}</option>`).join('');
  S.cases = LS.get('zw-cases', []); S.school = LS.get('zw-school','both');
  S.refDate = new Date(); S.refDate.setHours(12,0,0,0);
  $('#fRef').value = fmtDate(S.refDate);
  document.querySelectorAll('[name=school]').forEach(r=>{ r.checked = r.value===S.school; r.onchange=()=>{ S.school=r.value; LS.set('zw-school',S.school); renderMenu(); renderChart(); }; });
  $('#fCal').onchange = ()=>{ $('#leapWrap').hidden = $('#fCal').value!=='lunar'; };
  $('#form').onsubmit = e=>{ e.preventDefault(); const f=readForm(); if(!f.date){ $('#err').hidden=false; $('#err').textContent='請填寫出生日期。'; return; } S.cur={...f, id:'tmp'}; S.sel=null; refresh(); renderCases(); };
  $('#saveCase').onclick = ()=>{ const f=readForm(); if(!f.date) return; const ex=S.cases.find(c=>c.name===f.name); const c={...f, id: ex?ex.id:'c'+Date.now()}; S.cases = ex? S.cases.map(x=>x.id===ex.id?c:x) : [...S.cases, c]; LS.set('zw-cases',S.cases); S.cur=c; refresh(); renderCases(); $('#saveCase').textContent='已儲存'; setTimeout(()=>$('#saveCase').textContent='儲存問測者',1500); };
  $('#fRef').onchange = ()=>{ const v=$('#fRef').value; if(!v) return; const [y,m,d]=v.split('-').map(Number); S.refDate=new Date(y,m-1,d,12); refresh(); };
  const shift=(dy,dm)=>{ const d=new Date(S.refDate); d.setFullYear(d.getFullYear()+dy); d.setMonth(d.getMonth()+dm); S.refDate=d; $('#fRef').value=fmtDate(d); refresh(); };
  $('#yPrev').onclick=()=>shift(-1,0); $('#yNext').onclick=()=>shift(1,0); $('#mPrev').onclick=()=>shift(0,-1); $('#mNext').onclick=()=>shift(0,1);
  $('#today').onclick=()=>{ S.refDate=new Date(); S.refDate.setHours(12,0,0,0); $('#fRef').value=fmtDate(S.refDate); refresh(); };
  document.querySelectorAll('#scopeTabs button').forEach(b=>b.onclick=()=>{ S.scope=b.dataset.sc; renderChart(); });
  $('#fDec').onchange=()=>{ const y=S.a.birthYear+ +$('#fDec').value-1; S.refDate=new Date(y,7,15,12); $('#fRef').value=fmtDate(S.refDate); S.scope='decadal'; refresh(); };
  $('#fMini').onchange=()=>{ S.mini=$('#fMini').checked; renderChart(); };
  $('#gen').onclick = ()=>genReport(true);
  $('#copy').onclick = ()=>{ const t=$('#report').innerText; if(!t.trim()) return; navigator.clipboard.writeText(t).then(()=>{ $('#copy').textContent='已複製'; setTimeout(()=>$('#copy').textContent='複製命書文字',1500); }).catch(()=>{ const r=document.createRange(); r.selectNodeContents($('#report')); const s=getSelection(); s.removeAllRanges(); s.addRange(r); }); };
  renderMenu(); loadCase(SAMPLE); genReport(false);
}
init();
</script></body></html>
